<title>JF Gräfenhausen – Schriftführer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#221a17;--mut:#7a6d66;--line:#e3d9cf;--red:#c8102e;--redink:#fff;--soft:#f9e3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171211;--card:#221b19;--ink:#f1e8e2;--mut:#a89a92;--line:#3a2f2b;--red:#e5384f;--soft:#3a1e23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171211;--card:#221b19;--ink:#f1e8e2;--mut:#a89a92;--line:#3a2f2b;--red:#e5384f;--soft:#3a1e23;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:10}
header{background:var(--red);color:#fff;padding:14px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:56px;height:56px;border-radius:13px;background:#fff;flex:none}.brand h1{font-size:22px}
.logo{background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:6px}.logo img{display:block;width:100%;max-width:440px;height:auto}
header h1{margin:0;font:700 24px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
header small{opacity:.85;font-size:12px}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:1;background:rgba(255,255,255,.15);color:#fff;border:0;padding:9px 4px;font:600 14px Barlow,sans-serif;border-radius:8px}
nav button.on{background:#fff;color:#c8102e}
main{max-width:820px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
button.pri,button.sec,button.del{font:600 15px Barlow,sans-serif;border-radius:8px;padding:11px 16px;border:0}
.pri{background:var(--red);color:#fff}.sec{background:var(--soft);color:var(--red)}.del{background:transparent;color:var(--mut);text-decoration:underline}
.item{display:flex;gap:12px;cursor:pointer}
.date{min-width:52px;text-align:center;background:var(--soft);color:var(--red);border-radius:8px;padding:6px 4px;font:700 22px/1 "Barlow Condensed",sans-serif}
.date small{display:block;font:600 11px Barlow;text-transform:uppercase}
.item h3{margin:0;font:700 19px/1.2 "Barlow Condensed",sans-serif}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--red);border:1px solid var(--red);border-radius:99px;padding:0 8px;margin-right:6px}
.mut{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 32px/1 "Barlow Condensed",sans-serif;color:var(--red)}
h2{font:700 22px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;border-bottom:2px solid var(--red);padding-bottom:2px}
.pre{white-space:pre-wrap}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>

let items=[],meta={},view="list",cur=null,year=new Date().getFullYear(),q="",db=null,dl=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fd=d=>d?new Date(d+"T12:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
const today=()=>new Date().toISOString().slice(0,10);

async function init(){
  const to=new Promise(r=>setTimeout(()=>r(null),4000));
  db=null;
  dl=null;
  if(db){
    $("#st").textContent="synchronisiert auf allen Geräten";
    db.collection("berichte").onSnapshot(s=>{items=s.docs.map(d=>({...d.data(),id:d.id}));if(view!=="form")render()},()=>{});
    db.collection("jahr").onSnapshot(s=>{meta={};s.docs.forEach(d=>meta[d.id]=d.data());if(view!=="form"&&document.activeElement.tagName!=="TEXTAREA")render()},()=>{});
  }else{
    $("#st").textContent="nur auf diesem Gerät gespeichert";
    items=LS.get("b")||[];meta=LS.get("m")||{};
  }
  render();
}
async function saveItem(it){
  if(db){await db.collection("berichte").doc(it.id).set(it)}
  else{items=items.filter(x=>x.id!==it.id).concat(it);LS.set("b",items)}
}
async function delItem(id){
  if(db){await db.collection("berichte").doc(id).delete()}
  else{items=items.filter(x=>x.id!==id);LS.set("b",items)}
}
async function saveMeta(y,field,val){
  const m={...(meta[y]||{}),[field]:val};meta[y]=m;
  if(db){await db.collection("jahr").doc(String(y)).set(m)}else LS.set("m",meta);
}
function go(v){view=v;cur=null;render();window.scrollTo(0,0)}
function years(){const s=new Set(items.map(i=>(i.datum||"").slice(0,4)).filter(Boolean));s.add(String(new Date().getFullYear()));Object.keys(meta).forEach(k=>s.add(k));return [...s].sort().reverse()}
function render(){
  $("#nav").innerHTML=[["list","Berichte"],["form","＋ Neu"],["year","Jahresbericht"]].map(([k,t])=>`<button class="${view===k?"on":""}" onclick="${k==="form"?"newItem()":`go('${k}')`}">${t}</button>`).join("");
  $("#app").innerHTML=view==="list"?vList():view==="form"?vForm():vYear();
  if(view==="year")$("#app").insertAdjacentHTML("beforeend",BK);
}
function yearSel(){return `<div style="display:flex;gap:4px"><select onchange="year=+this.value;render()">${years().map(y=>`<option ${+y===year?"selected":""}>${y}</option>`).join("")}</select><button class="sec" style="padding:8px 12px" title="Jahr hinzufügen" onclick="addYear()">＋</button></div>`}
function addYear(){const y=parseInt(prompt("Welches Jahr soll angelegt werden? (z. B. 2027)"));if(!(y>=2000&&y<=2100))return;saveMeta(y,"angelegt",true);year=y;render()}
function vList(){
  const l=items.filter(i=>(i.datum||"").startsWith(year)).filter(i=>!q||JSON.stringify(i).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.datum.localeCompare(a.datum));
  return `<div class="row" style="margin-bottom:10px"><div style="width:150px">${yearSel()}</div><button class="sec" onclick="pdfAll()">Alle als PDF</button><input class="grow" placeholder="Suchen …" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.t);window.t=setTimeout(()=>{render();const i=document.querySelector('main input.grow');i.focus();i.setSelectionRange(99,99)},300)"></div>`+
  (l.length?l.map(i=>{const d=new Date(i.datum+"T12:00");return `<div class="card item" onclick="edit('${i.id}')"><div class="date">${d.getDate()}<small>${d.toLocaleDateString("de-DE",{month:"short"})}</small></div><div><h3>${esc(i.titel)}</h3><div><span class="chip">${esc(i.typ)}</span><span class="mut">${i.jugendliche?i.jugendliche+" Jugendliche":""}</span></div><div class="mut">${esc((i.inhalt||"").slice(0,110))}${(i.inhalt||"").length>110?" …":""}</div></div></div>`}).join(""):`<div class="empty">Noch keine Berichte für ${year}.<br><br><button class="pri" onclick="newItem()">Ersten Bericht anlegen</button></div>`);
}
function newItem(){cur={id:Date.now().toString(36),datum:today(),typ:TYPEN[0],titel:"",ort:"",jugendliche:"",betreuer:"",anwesend:"",inhalt:"",beschluesse:"",notizen:""};view="form";render();window.scrollTo(0,0)}
function edit(id){cur={...items.find(i=>i.id===id)};view="form";render();window.scrollTo(0,0)}
function vForm(){
  const c=cur,f=(k,l,t="text")=>`<label>${l}</label><input type="${t}" id="f_${k}" value="${esc(c[k])}">`,a=(k,l,h)=>`<label>${l}</label><textarea id="f_${k}" style="min-height:${h}px">${esc(c[k])}</textarea>`;
  return `<div class="card">${items.some(i=>i.id===c.id)?"":`<label style="margin-top:0">Vorlage verwenden</label><div class="row"><button class="sec" onclick="vorlage('Jahreshauptversammlung')">Jahreshauptversammlung</button><button class="sec" onclick="vorlage('Übungsplanung')">Übungsplanung</button></div>`}<div class="row"><div class="grow">${f("datum","Datum","date")}</div><div class="grow"><label>Art</label><select id="f_typ">${TYPEN.map(t=>`<option ${t===c.typ?"selected":""}>${t}</option>`).join("")}</select></div></div>
  ${f("titel","Titel / Anlass")}${f("ort","Ort")}
  <div class="row"><div class="grow">${f("jugendliche","Anzahl Jugendliche","number")}</div><div class="grow">${f("betreuer","Anzahl Betreuer","number")}</div></div>
  ${a("anwesend","Anwesende / Entschuldigt",60)}${a("inhalt","Verlauf / Inhalt",160)}${a("beschluesse","Beschlüsse & Aufgaben (wer macht was bis wann)",110)}${a("notizen","Sonstige Notizen",70)}
  <div class="row" style="margin-top:16px"><button class="pri" onclick="submitItem()">Speichern</button><button class="sec" onclick="go('list')">Abbrechen</button><button class="sec" onclick="pdfOne()">Als PDF</button>${items.some(i=>i.id===c.id)?`<button class="del" onclick="removeItem()">Löschen</button>`:""}</div></div>`;
}
function vorlage(k){
  if(($("#f_inhalt").value||$("#f_titel").value)&&!confirm("Bereits eingegebene Texte durch die Vorlage ersetzen?"))return;
  cur.datum=$("#f_datum").value||cur.datum;
  Object.assign(cur,{jugendliche:"",betreuer:""},VORLAGEN[k]);render();
}
async function submitItem(){
  const it={id:cur.id};["datum","typ","titel","ort","jugendliche","betreuer","anwesend","inhalt","beschluesse","notizen"].forEach(k=>it[k]=$("#f_"+k).value.trim());
  if(!it.datum||!it.titel){alert("Bitte Datum und Titel angeben.");return}
  try{await saveItem(it)}catch(e){alert("Speichern fehlgeschlagen.");return}
  year=+it.datum.slice(0,4);go("list");
}
async function removeItem(){if(confirm("Diesen Bericht wirklich löschen?")){await delItem(cur.id);go("list")}}

function yearData(){
  const l=items.filter(i=>(i.datum||"").startsWith(year)).sort((a,b)=>a.datum.localeCompare(b.datum));
  const jug=l.reduce((s,i)=>s+(+i.jugendliche||0),0),withJ=l.filter(i=>+i.jugendliche).length;
  return {l,jug,avg:withJ?Math.round(jug/withJ):0,bes:l.filter(i=>i.beschluesse)};
}
function vYear(){
  const d=yearData(),m=meta[year]||{};
  const by=TYPEN.map(t=>[t,d.l.filter(i=>i.typ===t)]).filter(x=>x[1].length);
  return `<div class="row" style="margin-bottom:10px"><div style="width:150px">${yearSel()}</div><button class="pri" onclick="pdfYear()">Jahresbericht als PDF</button><button class="sec" onclick="pdfAll()">Alle Berichte als PDF</button><button class="sec" onclick="copyReport()">Text kopieren</button></div>
  <div class="stats"><div class="stat"><b>${d.l.length}</b>Einträge</div><div class="stat"><b>${d.l.filter(i=>i.typ==="Übungsdienst").length}</b>Übungsdienste</div><div class="stat"><b>${d.l.filter(i=>i.typ==="Ausschusssitzung").length}</b>Sitzungen</div><div class="stat"><b>${d.avg}</b>Ø Jugendliche</div></div>
  <div class="card"><label style="margin-top:0">Vorwort (z. B. Jahresrückblick)</label><textarea onchange="saveMeta(year,'vorwort',this.value)">${esc(m.vorwort)}</textarea><label>Ausblick / Ziele für das nächste Jahr</label><textarea onchange="saveMeta(year,'ausblick',this.value)">${esc(m.ausblick)}</textarea></div>
  ${d.l.length?"":`<div class="empty">Für ${year} liegen noch keine Berichte vor.</div>`}
  ${by.map(([t,l])=>`<h2>${t} (${l.length})</h2>`+l.map(i=>`<div class="card"><b>${fd(i.datum)} – ${esc(i.titel)}</b><div class="mut">${esc(i.ort)}${i.jugendliche?" · "+i.jugendliche+" Jugendliche":""}${i.betreuer?" · "+i.betreuer+" Betreuer":""}</div><div class="pre">${esc(i.inhalt)}</div></div>`).join("")).join("")}
  ${d.bes.length?`<h2>Beschlüsse & Aufgaben</h2>`+d.bes.map(i=>`<div class="card"><b>${fd(i.datum)} · ${esc(i.titel)}</b><div class="pre">${esc(i.beschluesse)}</div></div>`).join(""):""}`;
}
function reportText(){
  const d=yearData(),m=meta[year]||{};let s=`Jahresbericht ${year}\nJugendfeuerwehr Gräfenhausen\n\n`;
  if(m.vorwort)s+=m.vorwort+"\n\n";
  s+=`Das Jahr in Zahlen: ${d.l.length} Einträge, davon ${d.l.filter(i=>i.typ==="Übungsdienst").length} Übungsdienste und ${d.l.filter(i=>i.typ==="Ausschusssitzung").length} Ausschusssitzungen. Durchschnittlich nahmen ${d.avg} Jugendliche teil.\n\n`;
  TYPEN.forEach(t=>{const l=d.l.filter(i=>i.typ===t);if(!l.length)return;s+=`${t.toUpperCase()}\n`;l.forEach(i=>{s+=`\n${fd(i.datum)} – ${i.titel}${i.ort?" ("+i.ort+")":""}${i.jugendliche?", "+i.jugendliche+" Jugendliche":""}\n${i.inhalt||""}\n`});s+="\n"});
  if(d.bes.length){s+="BESCHLÜSSE & AUFGABEN\n";d.bes.forEach(i=>s+=`\n${fd(i.datum)} – ${i.titel}\n${i.beschluesse}\n`);s+="\n"}
  if(m.ausblick)s+=`AUSBLICK\n${m.ausblick}\n`;
  return s;
}
async function copyReport(){
  try{await navigator.clipboard.writeText(reportText());alert("Bericht in die Zwischenablage kopiert.")}
  catch(e){const t=document.createElement("textarea");t.value=reportText();document.body.appendChild(t);t.select();try{document.execCommand("copy");alert("Bericht kopiert.")}catch(x){alert("Kopieren nicht möglich.")}t.remove()}
}
async function exportReport(){
  const h=`<!doctype html><html lang="de"><meta charset="utf-8"><title>Jahresbericht ${year}</title><body style="font:16px/1.5 Georgia,serif;max-width:720px;margin:30px auto;padding:0 16px"><pre style="white-space:pre-wrap;font:inherit">${esc(reportText())}</pre></body></html>`;
  if(!dl){copyReport();return}
  try{await dl.save({filename:`Jahresbericht-JF-Graefenhausen-${year}.html`,data:h})}catch(e){if(e&&e.code!=="declined")copyReport()}
}
const clean=s=>String(s??"").replace(/[^\n\x20-\x7E\u00A0-\u00FF\u2013\u2014\u2018-\u201E\u2022\u20AC]/g,"");
function buildPdf(bl){
  const J=window.jspdf;if(!J)return null;
  const d=new J.jsPDF({unit:"mm",format:"a4"}),M=18,TW=174;let y=M;
  try{const lw=105;d.addImage(LOGO,"JPEG",M,M,lw,lw*LR);y=M+lw*LR+8}catch(e){}
  const S={title:[20,1,[200,16,46],2],sub:[9,0,[107,95,89],5],h2:[13,1,[200,16,46],2],h3:[11,1,[34,26,23],1],lab:[8.5,1,[107,95,89],.5],m:[9,0,[107,95,89],1.5],p:[10.5,0,[34,26,23],3]};
  bl.forEach(([k,t])=>{
    const [sz,b,c,gap]=S[k],lh=sz*.46;
    const st=()=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(sz);d.setTextColor(...c)};
    st();const lines=d.splitTextToSize(clean(t),TW);
    if((k==="h2"||k==="h3")&&y>250){d.addPage();y=M}
    if(k==="h2")y+=4;
    lines.forEach(l=>{if(y>279){d.addPage();y=M}st();d.text(l,M,y);y+=lh});
    if(k==="h2"||k==="title"){d.setDrawColor(200,16,46);d.setLineWidth(.5);d.line(M,y-lh+1.8,M+TW,y-lh+1.8);y+=1.5}
    y+=gap;
  });
  const n=d.getNumberOfPages();
  for(let i=1;i<=n;i++){d.setPage(i);d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(107,95,89);d.text("Jugendfeuerwehr Gräfenhausen",M,290);d.text(`Seite ${i} von ${n}`,192,290,{align:"right"})}
  return d;
}
async function savePdf(bl,name){
  const d=buildPdf(bl);
  if(!d){alert("PDF-Export ist nicht verfügbar. Bitte Internetverbindung prüfen.");return}
  d.save(name);
}
function eBl(i){
  const b=[["h3",`${fd(i.datum)} – ${i.titel}`],["m",[i.typ,i.ort,i.jugendliche&&i.jugendliche+" Jugendliche",i.betreuer&&i.betreuer+" Betreuer"].filter(Boolean).join(" · ")]];
  [["anwesend","Anwesende / Entschuldigt"],["inhalt","Verlauf / Inhalt"],["beschluesse","Beschlüsse & Aufgaben"],["notizen","Notizen"]].forEach(([k,l])=>{if(i[k])b.push(["lab",l.toUpperCase()],["p",i[k]])});
  return b;
}
function pdfOne(){
  const it={};["datum","typ","titel","ort","jugendliche","betreuer","anwesend","inhalt","beschluesse","notizen"].forEach(k=>it[k]=$("#f_"+k).value.trim());
  if(!it.datum||!it.titel){alert("Bitte Datum und Titel angeben.");return}
  savePdf([["title","Bericht"],["sub","Jugendfeuerwehr Gräfenhausen"],...eBl(it)],`Bericht-${it.datum}.pdf`);
}
function pdfAll(){
  const l=items.filter(i=>(i.datum||"").startsWith(year)).sort((a,b)=>a.datum.localeCompare(b.datum));
  if(!l.length){alert(`Für ${year} gibt es noch keine Berichte.`);return}
  const b=[["title",`Berichte ${year}`],["sub",`Jugendfeuerwehr Gräfenhausen · Gesamtdokumentation · ${l.length} Einträge`]];
  l.forEach(i=>{b.push(...eBl(i),["p",""])});
  savePdf(b,`Berichte-JF-Graefenhausen-${year}.pdf`);
}
function pdfYear(){
  const d=yearData(),m=meta[year]||{};
  if(!d.l.length&&!m.vorwort){alert(`Für ${year} gibt es noch keine Berichte.`);return}
  const b=[["title",`Jahresbericht ${year}`],["sub","Jugendfeuerwehr Gräfenhausen"]];
  if(m.vorwort)b.push(["p",m.vorwort]);
  b.push(["h2","Das Jahr in Zahlen"],["p",`${d.l.length} Einträge, davon ${d.l.filter(i=>i.typ==="Übungsdienst").length} Übungsdienste und ${d.l.filter(i=>i.typ==="Ausschusssitzung").length} Ausschusssitzungen. Durchschnittlich nahmen ${d.avg} Jugendliche teil.`]);
  TYPEN.forEach(t=>{const l=d.l.filter(i=>i.typ===t);if(!l.length)return;b.push(["h2",`${t} (${l.length})`]);l.forEach(i=>{b.push(["h3",`${fd(i.datum)} – ${i.titel}`],["m",[i.ort,i.jugendliche&&i.jugendliche+" Jugendliche",i.betreuer&&i.betreuer+" Betreuer"].filter(Boolean).join(" · ")]);if(i.inhalt)b.push(["p",i.inhalt])})});
  if(d.bes.length){b.push(["h2","Beschlüsse & Aufgaben"]);d.bes.forEach(i=>b.push(["h3",`${fd(i.datum)} – ${i.titel}`],["p",i.beschluesse]))}
  if(m.ausblick)b.push(["h2","Ausblick"],["p",m.ausblick]);
  savePdf(b,`Jahresbericht-JF-Graefenhausen-${year}.pdf`);
}
const BK=`<div class="card" style="margin-top:18px"><b>Datensicherung</b><div class="mut">Alle Berichte als Datei sichern oder wiederherstellen. Bitte regelmäßig sichern, die Daten liegen nur auf diesem Gerät.</div><div class="row" style="margin-top:8px"><button class="sec" onclick="backup()">Sichern</button><label class="sec" style="margin:0;padding:11px 16px;border-radius:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:15px">Wiederherstellen<input type="file" accept="application/json,.json" style="display:none" onchange="restore(this.files[0])"></label></div></div>`;
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({items,meta})],{type:"application/json"}));a.download=`JFG-Sicherung-${today()}.json`;document.body.appendChild(a);a.click();a.remove()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;if(!confirm(`${d.items.length} Berichte laden und die aktuellen Daten ersetzen?`))return;items=d.items;meta=d.meta||{};LS.set("b",items);LS.set("m",meta);render()}catch(e){alert("Datei nicht lesbar.")}};r.readAsText(f)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
</script>
</body>
</html>
